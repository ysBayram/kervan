apiVersion: v1
kind: Service
metadata:
  name: kervan
  namespace: kervan
  labels:
    app: kervan
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  ports:
    - name: ws
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
  selector:
    app: kervan
